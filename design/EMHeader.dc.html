<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:linear-gradient(115deg,#ec6423 0%,#f39a2e 100%);color:#fff;font-family:'Nunito',sans-serif">
<div style="max-width:1200px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
<a href="EnglishMinds Site v2.dc.html" style="text-decoration:none;display:flex;flex-direction:column;line-height:.84;font-weight:900;color:#fff"><span style="font-size:28px;letter-spacing:-.02em">english</span><span style="display:flex;align-items:center;gap:3px;font-size:28px;letter-spacing:-.02em"><span style="width:21px;height:21px;background:#ffc41f;clip-path:polygon(50% 0,64.5% 24.9%,93.3% 25%,79% 50%,93.3% 75%,64.5% 75.1%,50% 100%,35.5% 75.1%,6.7% 75%,21% 50%,6.7% 25%,35.5% 24.9%)"></span>minds</span><span style="font-size:14px;letter-spacing:.03em;margin:4px 0 0 21px">ACADEMY</span></a>
<div style="display:flex;gap:6px 26px;flex-wrap:wrap;font-weight:800;font-size:16px">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="5"><a href="{{ l.href }}" style="text-decoration:none;color:#fff;padding-bottom:3px;border-bottom:3px solid {{ l.line }}">{{ l.label }}</a></sc-for>
</div>
<a href="https://wa.me/40775630680" style="text-decoration:none;background:#14224a;color:#fff;font-weight:900;font-size:15px;padding:13px 22px;border-radius:999px">Rezervă locul acum</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;100px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;acasa&quot;,&quot;cursuri&quot;,&quot;metoda&quot;,&quot;tabere&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;acasa&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || '';
    const L = [['acasa', 'Acasă', 'EnglishMinds Site v2.dc.html'], ['cursuri', 'Cursuri', 'EnglishMinds Grupe.dc.html'], ['metoda', 'Metoda Cambridge', 'EnglishMinds Metoda.dc.html'], ['test', 'Test de nivel', 'EnglishMinds Test.dc.html'], ['tabere', 'Tabere de vară', 'EnglishMinds Tabere.dc.html'], ['blog', 'Blog', 'EnglishMinds Blog.dc.html']];
    return { links: L.map(([k, label, href]) => ({ label, href, line: k === a ? '#ffc41f' : 'transparent' })) };
  }
}
</script>
</body>
</html>
