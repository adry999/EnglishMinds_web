name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  tip:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Skip when a newer commit exists
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: $HEAD_SHA is no longer the tip of $BRANCH"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: tip
    if: >-
      needs.tip.outputs.current == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      SITE_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:server
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Write SSH credentials
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - run: bash scripts/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_WEB_ROOT: ${{ vars.DEPLOY_WEB_ROOT }}
          DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
          DEPLOY_HTPASSWD_FILE: ${{ vars.DEPLOY_HTPASSWD_FILE }}
          DEPLOY_KEY_FILE: /home/runner/.ssh/deploy_key
          DEPLOY_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
