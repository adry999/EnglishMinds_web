<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fff5e6;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{opacity:.9}*{box-sizing:border-box}</style>
</helmet>
<div style="font-family:'Nunito',sans-serif;color:#14224a;min-height:100vh">
<div style="background:linear-gradient(115deg,#ec6423 0%,#f39a2e 100%);color:#fff">
<div style="max-width:1200px;margin:0 auto;padding:40px 24px 48px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-direction:column;line-height:.84;font-weight:900"><span style="font-size:30px;letter-spacing:-.02em">english</span><span style="display:flex;align-items:center;gap:3px;font-size:30px;letter-spacing:-.02em"><span style="width:22px;height:22px;background:#ffc41f;clip-path:polygon(50% 0,64.5% 24.9%,93.3% 25%,79% 50%,93.3% 75%,64.5% 75.1%,50% 100%,35.5% 75.1%,6.7% 75%,21% 50%,6.7% 25%,35.5% 24.9%)"></span>minds</span><span style="font-size:15px;letter-spacing:.03em;margin:4px 0 0 22px">ACADEMY</span></div>
<h1 style="margin:0;font-weight:900;font-size:clamp(36px,5vw,56px);line-height:1;letter-spacing:-.02em">Proiect: site și materiale</h1>
<div style="font-size:18px;font-weight:700;max-width:620px;line-height:1.45">Toate paginile și materialele la care lucrăm, într-un singur loc. Dă click pe un card ca să-l deschizi.</div>
</div>
</div>
<div style="max-width:1200px;margin:0 auto;padding:48px 24px 96px;display:flex;flex-direction:column;gap:48px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;color:#c4501a">{{ g.title }}</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px">
<sc-for list="{{ g.items }}" as="p" hint-placeholder-count="4"><a href="{{ p.href }}" style="text-decoration:none;background:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 #f0dcc0;min-height:170px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-weight:900;font-size:21px;line-height:1.15">{{ p.name }}</span><span style="flex:none;white-space:nowrap;border-radius:999px;padding:4px 10px;font-weight:900;font-size:12px;background:{{ p.bg }};color:{{ p.fg }}">{{ p.status }}</span></div><div style="font-size:15px;line-height:1.5;font-weight:600;opacity:.85">{{ p.desc }}</div><div style="margin-top:auto;font-weight:900;font-size:15px;color:#c4501a">Deschide →</div></a></sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const ST = { gata: ['Gata', '#dff3e6', '#1f7a45'], lucru: ['În lucru', '#fff0d6', '#b8461a'], explorare: ['Explorare', '#e8ebf3', '#14224a'] };
const G = [
  { title: 'Prezentare', items: [
    ['Prezentarea propunerii', 'EnglishMinds Oferta.dc.html', 'Pe scurt: cum aduce site-ul înscrieri, ce am pregătit, pașii următori.', 'gata']
  ] },
  { title: 'Site', items: [
    ['Pagina principală', 'EnglishMinds Site v2.dc.html', 'Hero cu Ema, grupe, test scurt, întrebări frecvente, contact. Desktop și mobil.', 'gata'],
    ['Grupe de vârstă', 'EnglishMinds Grupe.dc.html', 'Șablon pentru cele 5 grupe. Preț, zile și manual de completat.', 'lucru'],
    ['Metoda Cambridge', 'EnglishMinds Metoda.dc.html', 'Metoda explicată pentru părinți, cu drumul prin niveluri.', 'gata'],
    ['Test de nivel complet', 'EnglishMinds Test.dc.html', 'Test pe vârste și pentru examene, cu audio, rezultat detaliat și diplomă.', 'gata'],
    ['Tabere de vară', 'EnglishMinds Tabere.dc.html', 'Structura e gata. Perioada, programul și prețul sunt de completat.', 'lucru'],
    ['Blog', 'EnglishMinds Blog.dc.html', 'Listă de articole cu filtre. Articolele complete urmează.', 'lucru']
  ] },
  { title: 'Marketing', items: [
    ['Landing lecție demo', 'EnglishMinds Lectie Demo.dc.html', 'Pagină pentru reclame, fără meniu, cu rezervare pe WhatsApp.', 'gata'],
    ['Flyer A5', 'EnglishMinds Flyer.dc.html', 'Pentru școli și grădinițe, cu cod QR spre testul de nivel.', 'gata'],
    ['Șabloane Instagram', 'EnglishMinds Instagram.dc.html', 'Anunț, carusel, story cu ofertă și quiz cu Ema.', 'gata']
  ] },
  { title: 'Brand și explorări', items: [
    ['Ghid de brand', 'EnglishMinds Brand.dc.html', 'Logo, culori, fonturi, reguli pentru Ema, componente, ton.', 'gata']
  ] }
];
class Component extends DCLogic {
  renderVals() {
    return { groups: G.map(g => ({ title: g.title, items: g.items.map(([name, href, desc, s]) => ({ name, href, desc, status: ST[s][0], bg: ST[s][1], fg: ST[s][2] })) })) };
  }
}
</script>
</body>
</html>
